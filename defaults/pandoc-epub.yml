# EPUB 3 options (KDP, Apple Books, Kobo, D2D, IngramSpark). Identity metadata
# comes from the generated dist/.book-kit/pandoc-epub.yml.
from: markdown+yaml_metadata_block+smart+auto_identifiers+footnotes+strikeout+implicit_figures+emoji+fenced_divs+inline_code_attributes+raw_attribute-citations
table-of-contents: true
toc-depth: 2
standalone: true
epub-chapter-level: 1
metadata:
  documentclass: book
  css: style-epub.css
  document-css: false
  ibooks:
    version: '1.0'
top-level-division: chapter
embed-resources: true
